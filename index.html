<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swift UMDAC Datathon 2026 — Preliminary Dashboard</title>
<meta name="description" content="Six-page dashboard explained in plain English: routing visibility, payment duration, currency conversion, payment amounts, payment timing, duplicate payments.">
<style>
:root{--bg:#ffffff;--ink:#222222;--mut:#5A5A5A;--line:#ECE6DF;--navy:#1F1F1F;--blue:#ff751f;--gold:#e15f4b;--orange:#ff751f;--yellow:#ffd862;--red:#e15f4b;--font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;overflow:hidden;background:#ffffff}
.top{flex:none;display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);min-height:50px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-weight:800;letter-spacing:.06em;font-size:13px;white-space:nowrap}
.brand .mk{width:28px;height:28px;border-radius:7px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.02em}
.brand b{color:var(--orange)}
.live{font-size:11px;font-weight:700;color:#B45309;background:#FFF3D6;border:1px solid #F5D27A;border-radius:999px;padding:3px 9px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 0 rgba(255,117,31,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(255,117,31,0)}100%{box-shadow:0 0 0 0 rgba(255,117,31,0)}}
.sp{flex:1}
.pgname{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn:active{transform:translateY(1px)}
.stage{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.canvas-wrap{position:relative;margin:0 auto}
.canvas{position:relative;width:1600px;height:900px;transform-origin:0 0;background:transparent}
.page{position:absolute;left:0;top:0;width:1600px;height:900px;padding:22px 30px;display:none;grid-template-columns:1fr;grid-template-rows:auto auto 1fr;gap:12px;box-sizing:border-box}
.page.active{display:grid}
/* header */
.phead{grid-row:1;display:flex;flex-direction:column}
.phead .kicker{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--orange);text-transform:uppercase;margin-bottom:4px}
.phead h1{font-size:27px;font-weight:800;color:var(--ink);line-height:1.14;margin:0;letter-spacing:-.015em;max-width:1200px}
.phead .lede{font-size:14px;color:var(--mut);line-height:1.45;max-width:1200px;margin-top:6px}
/* metrics */
.metrics{grid-row:2;display:flex;gap:12px}
.metric{flex:1;background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 16px;display:flex;flex-direction:column;gap:2px}
.metric .mv{font-size:21px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.metric .ml{font-size:11px;color:var(--mut)}
/* body */
.body{grid-row:3;display:grid;grid-template-columns:2.1fr 1fr;gap:16px;min-height:0}
.v{position:relative;overflow:hidden;border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgba(34,34,34,.05);display:flex;flex-direction:column}
.vt{flex:none;font-size:14px;font-weight:700;color:var(--ink);padding:11px 16px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb{flex:1;min-height:0;position:relative}
.chart{position:absolute;inset:6px 10px 10px 10px;display:flex;align-items:center;justify-content:center}
.chart img{width:100%;height:100%;object-fit:contain;display:block}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.info{flex:1;border-radius:8px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);padding:11px 15px;display:flex;flex-direction:column;gap:4px;overflow:hidden;box-shadow:0 1px 3px rgba(34,34,34,.04)}
.info.how{border-left-color:var(--yellow)}
.info.lim{border-left-color:var(--red)}
.info .it{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.info.how .it{color:var(--orange)}
.info.lim .it{color:var(--red)}
.info .ib{font-size:12.8px;color:var(--ink);line-height:1.42}
.info .ib b{color:var(--navy)}
/* tabs */
.tabs{flex:none;display:flex;gap:4px;padding:6px 10px;background:#fff;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{font:inherit;font-size:12px;color:var(--mut);background:transparent;border:0;border-bottom:3px solid transparent;padding:7px 12px 5px;cursor:pointer;white-space:nowrap}
.tab b{color:var(--ink);margin-right:5px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.tab:hover{color:var(--ink)}
@media (max-height:520px){.top{min-height:40px;padding:4px 10px}.live{display:none}.tabs{padding:2px 8px}.tab{padding:5px 10px 3px}}
</style>
</head>

const canvas=document.getElementById("canvas");
const tabsEl=document.getElementById("tabs");
const pgname=document.getElementById("pgname");
const wrap=document.getElementById("wrap");
let active=PAGES[0].id;

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}

function buildPage(p){
  const d=el("div","page"+(p.n===1?" active":""));
  d.id="page-"+p.id;
  const c=CONTENT[p.id];
  const head=el("div","phead");
  head.appendChild(el("div","kicker",c.kicker));
  head.appendChild(el("h1","",c.headline));
  head.appendChild(el("div","lede",c.lede));
  d.appendChild(head);

  const mrow=el("div","metrics");
  c.metrics.forEach(m=>{
    const box=el("div","metric");
    box.appendChild(el("div","mv",m[0]));
    box.appendChild(el("div","ml",m[1]));
    mrow.appendChild(box);
  });
  d.appendChild(mrow);

  const body=el("div","body");
  const chartV=el("div","v");
  chartV.appendChild(el("div","vt",c.chartTitle));
  const vb=el("div","vb");
  const chart=el("div","chart");
  const img=document.createElement("img");
  img.alt=c.chartTitle;
  img.src=CHART_DATA[c.chart];
  chart.appendChild(img);
  vb.appendChild(chart);
  chartV.appendChild(vb);
  body.appendChild(chartV);

  const side=el("div","side");
  const sample=el("div","info");
  sample.appendChild(el("div","it","Data included"));
  sample.appendChild(el("div","ib",c.sample));
  side.appendChild(sample);
  const how=el("div","info how");
  how.appendChild(el("div","it","How we checked it"));
  how.appendChild(el("div","ib",c.tested));
  side.appendChild(how);
  const lim=el("div","info lim");
  lim.appendChild(el("div","it","Main limitation"));
  lim.appendChild(el("div","ib",c.limitation));
  side.appendChild(lim);
  body.appendChild(side);

  d.appendChild(body);
  return d;
}

function buildTabs(){
  PAGES.forEach(p=>{
    const b=el("button","tab");
    b.setAttribute("role","tab");
    b.setAttribute("aria-controls","page-"+p.id);
    b.setAttribute("aria-selected",p.id===active);
    b.innerHTML="<b>"+p.n+"</b> "+p.title;
    b.onclick=()=>select(p.id);
    tabsEl.appendChild(b);
  });
}

function select(id){
  active=id;
  pgname.textContent=PAGES.find(p=>p.id===id).title;
  PAGES.forEach(p=>{
    const d=document.getElementById("page-"+p.id);
    d.classList.toggle("active",p.id===id);
  });
  tabsEl.querySelectorAll(".tab").forEach((b,i)=>{
    b.setAttribute("aria-selected",PAGES[i].id===id);
  });
}

function fitCanvas(){
  const stage=document.getElementById("stage");
  const scale=Math.min(1,(stage.clientWidth-24)/1600);
  const s=scale>0?scale:1;
  canvas.style.transform="scale("+s+")";
  wrap.style.width=(1600*s)+"px";
  wrap.style.height=(900*s)+"px";
}
let zoomed=false;
function toggleZoom(){
  zoomed=!zoomed;
  if(zoomed){ canvas.style.transform="scale(1)"; wrap.style.width="1600px"; wrap.style.height="900px"; document.getElementById("stage").style.overflow="auto"; }
  else{ document.getElementById("stage").style.overflow="auto"; fitCanvas(); }
}

function mount(){
  PAGES.forEach(p=>canvas.appendChild(buildPage(p)));
  buildTabs();
  select(active);
  fitCanvas();
  window.addEventListener("resize",()=>{ if(!zoomed) fitCanvas(); });
}

document.addEventListener("keydown",(e)=>{
  const i=PAGES.findIndex(p=>p.id===active);
  if(e.key==="ArrowRight") select(PAGES[(i+1)%PAGES.length].id);
  if(e.key==="ArrowLeft") select(PAGES[(i-1+PAGES.length)%PAGES.length].id);
});
document.getElementById("zoombtn").addEventListener("click",toggleZoom);

mount();
</script>
