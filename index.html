<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swift UMDAC Datathon 2026 — Dashboard</title>
<meta name="description" content="Eight-page dashboard: executive summary, normal payment behaviour, anomalies, evidence and methodology.">
<style>
:root{--bg:#fff;--ink:#222;--mut:#5A5A5A;--line:#ECE6DF;--soft:#FBFAF7;--orange:#ff751f;--yellow:#ffd862;--red:#e15f4b;--dark:#1F1F1F;--font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:9px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:13px;letter-spacing:.06em;white-space:nowrap}
.brand .mk{width:28px;height:28px;border-radius:7px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.brand b{color:var(--orange)}
.live{font-size:11px;font-weight:700;color:#B45309;background:#FFF3D6;border:1px solid #F5D27A;border-radius:999px;padding:3px 9px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--orange)}
.sp{flex:1}.pgname{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.btn{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.btn.primary{background:var(--orange);border:1px solid var(--orange);color:#fff}
.nav{display:flex;gap:4px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:47px;z-index:19}
.tab{font:inherit;font-size:12px;color:var(--mut);background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px 6px;cursor:pointer;white-space:nowrap}
.tab b{color:var(--ink);margin-right:5px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange);font-weight:700}
.tab:hover{color:var(--ink)}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:20px 18px 70px}
.page{display:none}.page.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.phead{margin-bottom:14px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--orange);text-transform:uppercase;margin-bottom:4px}
h1{font-size:25px;font-weight:800;line-height:1.2;margin:0 0 8px;letter-spacing:-.015em;max-width:1000px}
.claim{font-size:16px;font-weight:700;color:var(--dark);line-height:1.4;max-width:1000px;margin:0 0 6px}
.sub{font-size:14px;color:var(--mut);line-height:1.5;max-width:900px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;border:1px solid var(--line)}
.chip.rec{background:#EEF4FF;border-color:#DBEAFE;color:#1E3A8A}
.chip.calc{background:#FFF7E6;border-color:#FBE1A8;color:#8A5A00}
.chip.mod{background:#FDECEA;border-color:#F7C6C0;color:#9B2C1E}
.chip.obs{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:0 1px 3px rgba(34,34,34,.05)}
.card h3{margin:0 0 6px;font-size:15px}
.card .big{font-size:20px;font-weight:800;color:var(--dark);letter-spacing:-.02em;line-height:1.25}
.muted{color:var(--mut);font-size:13px;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:8px 0 2px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.kpi .v{font-size:21px;font-weight:800;color:var(--dark);letter-spacing:-.02em}
.kpi .l{font-size:11.5px;color:var(--mut);margin-top:2px}
.link{color:var(--orange);font-weight:700;text-decoration:none;font-size:13px}
.link:hover{text-decoration:underline}
details.how{border:1px solid var(--line);border-radius:8px;margin-top:12px;background:var(--soft)}
details.how>summary{cursor:pointer;font-weight:700;font-size:13px;padding:10px 14px;color:var(--dark);list-style:none}
details.how>summary::-webkit-details-marker{display:none}
details.how>summary::before{content:"▸";color:var(--orange);margin-right:8px;display:inline-block;transition:.15s}
details.how[open]>summary::before{transform:rotate(90deg)}
details.how .body{padding:0 14px 12px;font-size:12.8px;color:var(--mut);line-height:1.55}
details.how .body ul{margin:6px 0;padding-left:18px}
.chartcard img{width:100%;height:auto;display:block;border-radius:6px;margin-top:8px}
.caption{font-size:12px;color:var(--mut);margin-top:6px}
/* map */
.mapwrap{position:relative;background:#F7FBFF;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:pan-y}
.bub{cursor:pointer;transition:opacity .12s}.bub:hover{opacity:.82}
.ctooltip{position:absolute;pointer-events:none;background:#1F1F1F;color:#fff;font-size:12px;padding:5px 9px;border-radius:6px;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;transform:translate(-50%,-130%)}
.ctooltip.on{opacity:1}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:12px;font-weight:600;background:#fff;color:var(--mut);border:0;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--orange);color:#fff}
.scope{font-size:12px;color:var(--mut);margin-left:auto}.scope b{color:var(--dark)}
.staticview{display:none;font-size:12.5px;color:var(--dark);background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.corr{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.corr .row{display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;font-size:12px}
.corr .lab{color:var(--dark);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corr .bar{height:16px;background:#F1EBE3;border-radius:4px;overflow:hidden}
.corr .fill{height:100%;background:var(--orange);border-radius:4px}
.corr .num{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.whatif .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.whatif label{font-size:12px;font-weight:700;color:var(--dark)}
.whatif input[type=range]{width:100%}
.whatif input[type=number]{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;width:100%}
.out{background:var(--soft);border:1px dashed #F5D27A;border-radius:8px;padding:12px 14px;margin-top:8px}
.out .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}.out .row b{font-size:16px;color:var(--dark)}
.flag{font-size:12px;color:var(--red);font-weight:700;margin-top:6px;display:none}.flag.on{display:block}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
table.ev{width:100%;border-collapse:collapse;font-size:12px}
table.ev th{background:var(--dark);color:#fff;text-align:left;padding:8px 9px;font-weight:700}
table.ev td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
table.ev tr:nth-child(even) td{background:var(--soft)}
table.ev .pg{white-space:nowrap;color:var(--orange);font-weight:700}
.note{border-left:4px solid var(--orange);background:var(--soft);border-radius:8px;padding:12px 16px;margin-top:12px;font-size:13px;line-height:1.55}
.note.red{border-left-color:var(--red)}
/* PDF mode */
body.pdf{--pdfgap:0}
body.pdf .nav,body.pdf .top .live,body.pdf .top .sp,body.pdf .top .pgname{display:none}
body.pdf .top{position:static}
body.pdf .controls{display:none}
body.pdf .staticview{display:block}
body.pdf .whatif .field{display:none}
body.pdf .tab{display:none}
body.pdf .pdfhead{display:block!important}
.pdfhead{display:none;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--orange);text-transform:uppercase;margin-bottom:6px}
@media (max-width:820px){h1{font-size:21px}.g2{grid-template-columns:1fr}.pgname,.live{display:none}main{padding:14px 12px 48px}.corr .row{grid-template-columns:78px 1fr 54px}}
</style>
</head>

<script>
const fmt=n=>n.toLocaleString("en-US");
const pct=x=>(x*100).toFixed(1)+"%";
const byId=id=>document.getElementById(id);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
function chip(k){const m={rec:"Recorded in synthetic data",calc:"Calculated from the data",mod:"Modelled scenario",obs:"Observed association"};return el("span","chip "+k,m[k]);}
const PAGES=[
 {id:"exec",n:1,title:"Executive summary"},
 {id:"routes",n:2,title:"Global payment routes"},
 {id:"speed",n:3,title:"Payment speed"},
 {id:"fx",n:4,title:"Currency conversion"},
 {id:"amounts",n:5,title:"Payment amounts"},
 {id:"timing",n:6,title:"Payment timing"},
 {id:"anomalies",n:7,title:"Anomaly patterns"},
 {id:"evidence",n:8,title:"Evidence & methodology"},
];
const desk="Sending / receiving institution locations in the synthetic dataset.";
function head(kicker,title,claim,sub){
  const h=el("div","phead");
  h.appendChild(el("div","pdfhead","Page "+PAGES.find(p=>p.title===title)?.n+" of 8 · "+title));
  h.appendChild(el("div","kicker",kicker));
  h.appendChild(el("h1","",title));
  if(claim)h.appendChild(el("p","claim",claim));
  if(sub)h.appendChild(el("div","sub",sub));
  return h;
}
function how(sum,body){const d=el("details","how");d.appendChild(el("summary","",sum));d.appendChild(el("div","body",body));return d;}
function imgCard(title,claim,imgKey,cap,howHtml){
  const c=el("div","card chartcard");c.appendChild(el("h3","",title));
  if(claim)c.appendChild(el("p","muted",claim));
  const im=document.createElement("img");im.src=CHARTS[imgKey];im.alt=title;c.appendChild(im);
  if(cap)c.appendChild(el("div","caption",cap));
  if(howHtml)c.appendChild(howHtml);
  return c;
}
function kpis(arr){const k=el("div","kpis");arr.forEach(x=>{const c=el("div","kpi");c.appendChild(el("div","v",x[0]));c.appendChild(el("div","l",x[1]));k.appendChild(c);});return k;}

/* ===== 1 Executive summary ===== */
function pageExec(){
  const p=el("div");
  p.appendChild(head("Page 1 of 8","Executive summary",
   "Problem statement: Which rules govern Swift’s simulated cross-border payments, and how do labelled anomalies depart from those patterns — including routing visibility, FX conversions, and duplicate payments?",
   "Scope: 9,999,999 synthetic cross-border payments, 30 April–31 July 2023. Every figure below is drawn from the reconciled import and the same charts on later pages."));
  const ch=el("div","chips");["rec","calc","mod","obs"].forEach(k=>ch.appendChild(chip(k)));p.appendChild(ch);
  p.appendChild(kpis([["9,999,999","synthetic payments"],["229","countries present"],["7,006","labelled anomalies"],["2 May–Jul","fit and test months"]]));
  const f=el("div","card");f.appendChild(el("h3","","Four findings this dashboard explains"));
  const g=el("div","grid g2");
  [["Route visibility","The more financial institutions a payment passed through, the less often its full path was recorded.","95.0% at 2 vs 61.7% at 10 financial institutions","routes","routes"],
   ["Payment speed","Median time rose from 39 s to 127 s when one intermediary bank was added (fully recorded routes).","39 s vs 127 s; rose in 105/105 like-for-like checks","speed","speed"],
   ["Currency conversion","Longer routes show more conversions overall, but within same-currency, same-type groups most showed little change.","84.3% → 96.3% overall; 45 of 58 groups flat","fx","fx"],
   ["Anomaly patterns","Labels track different senders and different repeat timing.","CEO 100% business senders; romance 100% consumer","anomalies","anomalies"],
  ].forEach(x=>{
    const c=el("div","card");c.appendChild(el("div","big",x[1]));
    c.appendChild(el("div","muted","Verified figure: "+x[2]));
    const a=el("a","link","Evidence on page "+(PAGES.find(p=>p.id===x[4])?.n)+" →");a.href="#"+x[4];a.onclick=e=>{e.preventDefault();select(x[4]);};c.appendChild(a);g.appendChild(c);
  });
  f.appendChild(g);p.appendChild(f);
  const h=el("div","card");h.appendChild(el("h3","","How to read this dashboard"));
  h.appendChild(el("div","muted","Each page leads with one sentence stating the result, the comparison and the group it applies to; the supporting chart sits directly below. Units, sample sizes and exclusions are shown; fuller checks are in the expandable “How we checked” boxes. Figures are labelled <b>Recorded in synthetic data</b>, <b>Calculated from the data</b>, <b>Observed association</b>, or <b>Modelled scenario</b>."));
  p.appendChild(h);
  return p;
}

/* ===== 2 Global routes (map + corridors + routing) ===== */
const COUNTRY=DATA.countries, CORR=DATA.corridors;
let mode="send", sel=null;
function projiz(lat,lon,W,H){return [(lon+180)/360*W,(90-lat)/180*H];}
function pageRoutes(){
  const p=el("div");
  p.appendChild(head("Page 2 of 8","Global payment routes",
   "The more financial institutions a payment passed through, the less often its full path was recorded — 95.0% at two institutions versus 61.7% at ten, across all 9,999,999 payments.",
   "A payment corridor is a sender-country → receiver-country pair. Full route visibility means the whole institution chain appears in the record (continuity flag = ‘Y’). Map shows "+desk));
  p.appendChild(el("div","muted","<b>How to use (HTML):</b> switch Sending/Receiving, hover a country for its count, click a country to focus it, Reset to show all. In the PDF this page shows the default Sending view of all countries."));

  const row=el("div","grid g2");
  const mapCard=el("div","card");mapCard.appendChild(el("h3","","Where sending and receiving institutions are based (synthetic data)"));
  const stat=el("div","staticview","");stat.id="mapStatic";
  mapCard.appendChild(stat);
  const ctr=el("div","controls");
  const seg=el("div","seg");const bS=el("button","","Sending");bS.setAttribute("aria-pressed","true");const bR=el("button","","Receiving");bR.setAttribute("aria-pressed","false");seg.appendChild(bS);seg.appendChild(bR);
  const rst=el("button","btn","Reset");rst.type="button";
  const sc=el("div","scope","");sc.id="scope";
  ctr.appendChild(seg);ctr.appendChild(rst);ctr.appendChild(sc);mapCard.appendChild(ctr);
  const mw=el("div","mapwrap");mw.id="mapwrap";mapCard.appendChild(mw);
  mapCard.appendChild(el("div","muted","Bubble size shows payment count for the selected direction. Corridor counts describe the simulation, not real payment flows."));
  row.appendChild(mapCard);

  const cc=el("div","card");cc.appendChild(el("h3","","Top payment corridors"));const cb=el("div","corr");cb.id="corr";cc.appendChild(cb);
  cc.appendChild(el("div","muted","Bars show payments on each country → country corridor in the current scope."));row.appendChild(cc);
  p.appendChild(row);

  p.appendChild(imgCard("How often the full route was recorded, by number of financial institutions",
    "Observed share with the full path recorded (bars) versus the May–June model (line). Sample sizes fall sharply with route length.",
    "routing_visibility","Observed (bars): 95.0% at 2 → 61.7% at 10 financial institutions. Model V(k)=0.954×0.948^(k−2), fitted on May–June routes of 2–10 institutions; the line is a model, not data.",
    how("How we checked","<b>Calculated from the data; model shown separately.</b><ul><li><b>Observed vs modelled:</b> bars are observed full-route visibility; the line is the fitted May–June rule V(k)=0.954×0.948<sup>(k−2)</sup>.</li><li><b>Fit then test:</b> fitted on May–June routes of 2–10 institutions, then checked on July (2,957,371 payments), which was not used to fit. July matched closely (pooled continuation predicted 34.864% vs actual 34.929%).</li><li><b>What visibility measures:</b> whether the whole chain of institutions appears in the record (continuity flag = ‘Y’).</li><li><b>Supported lengths:</b> 2–10 institutions. Each extra institution lowered the predicted share by about 5.19%. Two-institution group n=6,323,279; ten-institution n=2,205.</li><li><b>Limit:</b> routes of 10+ institutions are sparse, so the tail is less certain.</li></ul>")));

function currentScope(){if(!sel)return{label:"All payments",count:DATA.total};const c=COUNTRY[sel];return mode==="send"?{label:"Sent from "+c.name,count:c.send}:{label:"Received in "+c.name,count:c.recv};}
function topCorridors(){let rows;if(!sel)rows=CORR.map(r=>({o:r[0],b:r[1],n:r[2]}));else if(mode==="send")rows=CORR.filter(r=>r[0]===sel).map(r=>({o:r[0],b:r[1],n:r[2]}));else rows=CORR.filter(r=>r[1]===sel).map(r=>({o:r[0],b:r[1],n:r[2]}));rows.sort((a,b)=>b.n-a.n);return rows.slice(0,10);}

function initMap(){

  for(let lo=-180;lo<=180;lo+=30){const x=projiz(0,lo,W,H)[0];const l=document.createElementNS(ns,"line");l.setAttribute("x1",x);l.setAttribute("x2",x);l.setAttribute("y1",0);l.setAttribute("y2",H);l.setAttribute("stroke","#E7EEF6");svg.appendChild(l);}
  for(let la=-60;la<=60;la+=30){const y=projiz(la,0,W,H)[1];const l=document.createElementNS(ns,"line");l.setAttribute("x1",0);l.setAttribute("x2",W);l.setAttribute("y1",y);l.setAttribute("y2",y);l.setAttribute("stroke","#E7EEF6");svg.appendChild(l);}

    const circ=document.createElementNS(ns,"circle");circ.setAttribute("cx",p[0]);circ.setAttribute("cy",p[1]);circ.setAttribute("r",2+Math.sqrt(val/maxv)*12);
    circ.setAttribute("class","bub");circ.setAttribute("fill",sel===code?"#e15f4b":(val>maxv*0.4?"#ff751f":(val>maxv*0.1?"#ff9a4d":"#ffd862")));circ.setAttribute("stroke","#fff");circ.setAttribute("stroke-width","1");circ.dataset.code=code;
    circ.addEventListener("mousemove",ev=>{const r=mw.getBoundingClientRect();tip.style.left=(ev.clientX-r.left)+"px";tip.style.top=(ev.clientY-r.top)+"px";tip.classList.add("on");tip.innerHTML=c.name+"<br>"+(mode==="send"?"sent":"received")+": "+fmt(val);});

  seg.children[1].onclick=()=>{mode="recv";seg.children[1].setAttribute("aria-pressed","true");seg.children[0].setAttribute("aria-pressed","false");renderMap();renderCorridors();};
  seg.parentElement.querySelector(".btn").onclick=()=>{sel=null;mode="send";seg.children[0].setAttribute("aria-pressed","true");seg.children[1].setAttribute("aria-pressed","false");renderMap();renderCorridors();};

function renderMap(){const mw=byId("mapwrap");if(!mw)return;const svg=mw.querySelector("svg");if(!svg)return;const maxv=Math.max(...Object.values(COUNTRY).map(c=>Math.max(c.send,c.recv)));svg.querySelectorAll("circle.bub").forEach(circ=>{const c=COUNTRY[circ.dataset.code];const val=mode==="send"?c.send:c.recv;circ.setAttribute("r",2+Math.sqrt(val/maxv)*12);circ.setAttribute("fill",sel===circ.dataset.code?"#e15f4b":(val>maxv*0.4?"#ff751f":(val>maxv*0.1?"#ff9a4d":"#ffd862")));});}
function initWhatIf(){
  const ki=byId("kIn"),ko=byId("kOut"),ni=byId("nIn"),out=byId("wiOut"),flag=byId("wiFlag"),sv=byId("wiStatic");if(!ki)return;
  function calc(){
    const k=parseInt(ki.value,10);ko.textContent=k;let n=parseInt(ni.value,10);if(isNaN(n)||n<1)n=1;if(n>9999999)n=9999999;
    if(k<2||k>10){flag.textContent="Route length "+k+" is outside the validated range (2–10). No reliable modelled estimate.";flag.classList.add("on");out.innerHTML="";if(sv)sv.innerHTML="";return;}
    flag.classList.remove("on");const a=DATA.model.a, r=DATA.model.r;const share=a*Math.pow(r,k-2);const cnt=Math.round(n*share);
    out.innerHTML='<div class="row"><span>Fully-recorded share (modelled)</span><b>'+pct(share)+'</b></div><div class="row"><span>Estimated payments with a full route</span><b>'+fmt(cnt)+'</b></div><div class="row"><span>of chosen payments</span><b>'+fmt(n)+'</b></div><div class="muted" style="margin-top:6px">Modelled scenario — not an observed count. Uses V(k)=0.954×0.948<sup>(k−2)</sup>.</div>';
    if(sv)sv.innerHTML="<b>Example scenario:</b> "+fmt(n)+" payments at "+k+" financial institutions → "+pct(share)+" fully recorded (≈ "+fmt(cnt)+" payments). Modelled scenario.";
  }
  ki.addEventListener("input",calc);ni.addEventListener("input",calc);calc();
}

const BUILDERS={exec:pageExec,routes:pageRoutes,speed:pageSpeed,fx:pageFx,amounts:pageAmounts,timing:pageTiming,anomalies:pageAnomalies,evidence:pageEvidence};
const app=byId("app"),tabsEl=byId("tabs"),pgname=byId("pgname");
let active="exec";
function buildTabs(){PAGES.forEach(pg=>{const b=el("button","tab");b.setAttribute("role","tab");b.setAttribute("aria-selected",pg.id===active);b.innerHTML="<b>"+pg.n+"</b> "+pg.title;b.onclick=()=>select(pg.id);tabsEl.appendChild(b);});}
function select(id){active=id;pgname.textContent=PAGES.find(p=>p.id===id).title;document.querySelectorAll(".page").forEach(d=>d.classList.toggle("active",d.id==="page-"+id));tabsEl.querySelectorAll(".tab").forEach((b,i)=>b.setAttribute("aria-selected",PAGES[i].id===id));if(!document.body.classList.contains("pdf")&&location.hash.slice(1)!==id)history.replaceState(null,"","#"+id);}
function mount(){
  const pdfMode=/[?&]pdf=1/.test(location.search);
  PAGES.forEach(pg=>{const d=el("div","page"+(pg.id===active?" active":""));d.id="page-"+pg.id;d.appendChild(BUILDERS[pg.id]());app.appendChild(d);});
  buildTabs();
  let h=location.hash.slice(1);if(h&&PAGES.some(p=>p.id===h))active=h;
  select(active);
  if(pdfMode){document.body.classList.add("pdf");document.querySelectorAll("details").forEach(d=>d.open=true);}
}
document.addEventListener("keydown",e=>{if(document.body.classList.contains("pdf"))return;const i=PAGES.findIndex(p=>p.id===active);if(e.key==="ArrowRight")select(PAGES[(i+1)%PAGES.length].id);if(e.key==="ArrowLeft")select(PAGES[(i-1+PAGES.length)%PAGES.length].id);});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&PAGES.some(p=>p.id===h))select(h);});
mount();
